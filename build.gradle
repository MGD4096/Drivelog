// Versions match the project this one is modelled on (AGP 8.7.3 needs Gradle 8.9 or newer).
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
}

// One version for both apps, so a phone with an older Drivelog or plugin is easy to spot: versionCode is the number
// of commits, versionName 1.0.<that>. Outside a git checkout (or without git) both fall back to 1.
ext.drivelogVersionCode = { ->
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        def out = p.text.trim()
        p.waitFor() == 0 && out.isInteger() ? out.toInteger() : 1
    } catch (Exception ignored) {
        1
    }
}()
ext.drivelogVersionName = "1.0.${ext.drivelogVersionCode}"
